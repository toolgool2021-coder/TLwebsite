    <style>
        /* =========================
           INTRO ANIMATION
        ========================= */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #05070d;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #intro.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #intro-name {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1);
            font-size: clamp(38px, 8vw, 90px);
            font-weight: 800;
            letter-spacing: 1px;
            white-space: nowrap;
            opacity: 0;
            text-shadow:
                0 0 10px rgba(0, 170, 255, 0.7),
                0 0 30px rgba(0, 170, 255, 0.4);
            will-change: transform, opacity, filter;
            color: #fff;
        }

        #intro-name.appear {
            animation: nameAppear 0.7s ease-out forwards;
        }

        @keyframes nameAppear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.75);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
                filter: blur(0);
            }
        }

        #intro-name.explode {
            animation: explodeName 0.7s cubic-bezier(.2,.8,.2,1) forwards;
        }

        @keyframes explodeName {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
                filter: blur(0);
            }
            55% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.18);
                filter: blur(0);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2.2);
                filter: blur(18px);
            }
        }

        #intro-name.return {
            animation: nameReturn 0.75s ease-out forwards;
        }

        @keyframes nameReturn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) translateY(0) scale(0.95);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(0) scale(1);
                filter: blur(0);
            }
        }

        #intro-name.move-up {
            animation: moveNameUp 0.8s cubic-bezier(.2,.8,.2,1) forwards;
        }

        @keyframes moveNameUp {
            from {
                transform: translate(-50%, -50%) translateY(0) scale(1);
            }
            to {
                transform: translate(-50%, -50%) translateY(-150px) scale(0.85);
            }
        }

        #explosion {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            pointer-events: none;
        }

        #explosion.active {
            animation: explosion 0.65s ease-out forwards;
        }

        @keyframes explosion {
            0% {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(0);
                box-shadow:
                    0 0 0 0 rgba(0, 170, 255, 0.8);
            }
            40% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(18);
                box-shadow:
                    0 0 80px 40px rgba(0, 170, 255, 0);
            }
        }

        #intro-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .intro-particle {

            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #00aaff;
            box-shadow: 0 0 10px #00aaff;
            left: 50%;
            top: 50%;
        }

<script>
/* =========================
   INTRO ANIMATION LOGIC
========================= */

const intro = document.getElementById("intro");
const introName = document.getElementById("intro-name");
const explosion = document.getElementById("explosion");
const introParticles = document.getElementById("intro-particles");

let introStarted = false;
const startTime = performance.now();

// Генерация частиц при взрыве
function createIntroParticles() {
    const particleCount = 50;
    
    for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'intro-particle';
        
        const angle = (Math.random() * Math.PI * 2);
        const distance = Math.random() * 300 + 100;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        
        particle.style.setProperty('--tx', tx + 'px');
        particle.style.setProperty('--ty', ty + 'px');
        particle.style.animation = `introParticleBurst 0.9s cubic-bezier(.1,.8,.2,1) forwards`;
        particle.style.animationDelay = (Math.random() * 0.1) + 's';
        
        introParticles.appendChild(particle);
    }
    
    // Очистка частиц после анимации
    setTimeout(() => {
        introParticles.innerHTML = '';
    }, 1000);
}

// Добавляем CSS для анимации частиц
const introStyle = document.createElement('style');
introStyle.textContent = `
    @keyframes introParticleBurst {
        from {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        to {
            opacity: 0;
            transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0);
        }
    }
`;
document.head.appendChild(introStyle);

// Запуск интро при загрузке страницы
window.addEventListener("load", () => {
    const elapsed = performance.now() - startTime;
    const remaining = Math.max(0, 2500 - elapsed); // Минимум 2.5 секунды

    setTimeout(startIntro, remaining);
});

function startIntro() {
    if (introStarted) return;
    introStarted = true;

    // 1. Появление ника в центре
    introName.classList.add("appear");

    // 2. Через ~1.3 сек начинает раздуваться и взрывается
    setTimeout(() => {
        introName.classList.remove("appear");
        introName.classList.add("explode");
        explosion.classList.add("active");
        createIntroParticles();
    }, 1300);

    // 3. После взрыва ник появляется снова
    setTimeout(() => {
        introName.classList.remove("explode");
        explosion.classList.remove("active");
        
        void introName.offsetWidth; // Сброс анимации
        
        introName.classList.add("return");
    }, 2050);

    // 4. Ник уходит вверх
    setTimeout(() => {
        introName.classList.remove("return");
        introName.classList.add("move-up");
    }, 2900);

    // 5. Скрываем интро и показываем основной контент
    setTimeout(() => {
        intro.classList.add("hidden");
    }, 3700);
}
</script>
