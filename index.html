<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Toolgool - Personal Bio Site">
    <meta name="color-scheme" content="dark">
    <title>Toolgool - Bio Site</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- BACKGROUND LAYERS -->
<div id="background">
    <div class="bg-layer base-gradient"></div>
    <div class="bg-layer ambient-glow"></div>
    <div class="bg-layer particles-layer" aria-hidden="true"></div>
    <div class="bg-layer noise-layer" aria-hidden="true"></div>
</div>

<!-- INTRO SECTION -->
<div id="intro" aria-hidden="true">
    <div id="flash"></div>
    <div id="shockwave"></div>
    <div id="explosion"></div>
    <div id="intro-name">@Toolgool</div>
    <div id="intro-subtitle">✨ Добро пожаловать ✨</div>
    <div id="intro-particles"></div>
</div>

<canvas id="snowCanvas" aria-hidden="true"></canvas>

<div class="container">
    <main class="profile-section" role="main">

        <header class="profile-hero">
            <div class="avatar-container">
                <div class="avatar-wrapper">
                    <img src="./images/icon.jpg" alt="Avatar" class="avatar">
                </div>
            </div>

            <h1 class="username">@Toolgool</h1>
            <p class="short-desc">Frontend tinkerer · music lover · soft-glass UI enthusiast</p>

            <nav class="social-links" aria-label="Social links">
                <!-- Keep original anchors for backward compatibility -->
                <a href="javascript:void(0)" data-href="https://t.me/Toolgool" target="_blank" class="social-link" title="Telegram" aria-label="Telegram">
                    <img src="./images/Telegram.jpg" alt="Telegram">
                </a>
                <a href="javascript:void(0)" data-href="https://www.tiktok.com/@Toolgool2023" target="_blank" class="social-link" title="TikTok" aria-label="TikTok">
                    <img src="./images/Tiktok.jpg" alt="TikTok">
                </a>
                <a href="javascript:void(0)" data-href="https://github.com/Toolgool" target="_blank" class="social-link" title="GitHub" aria-label="GitHub">
                    <img src="./images/GitHub.jpg" alt="GitHub">
                </a>
                <!-- More icons preserved -->
            </nav>
        </header>

        <!-- ABOUT / POSTS -->
        <section class="posts-section" aria-labelledby="postsTitle">
            <h2 id="postsTitle">📮 Посты</h2>
            <div class="posts-container" id="postsContainer">
                <div class="loading-posts">Загрузка постов...</div>
            </div>
        </section>

        <!-- TEAM / CAROUSEL -->
        <section class="team-section" aria-labelledby="teamTitle">
            <h2 id="teamTitle">𓆩♡𓆪 𝖒𝖞 𝖇𝖊𝖘𝖙 𓆩♡𓆪</h2>

            <div class="carousel" id="friendsCarousel" tabindex="0" aria-roledescription="carousel">
                <button class="carousel-arrow prev" id="carouselPrev" aria-label="Previous friend">◀</button>

                <div class="carousel-track" id="carouselTrack" role="list" aria-live="polite"></div>

                <button class="carousel-arrow next" id="carouselNext" aria-label="Next friend">▶</button>
            </div>
        </section>

    </main>
</div>

<!-- FLOATING MUSIC PLAYER -->
<div class="music-player" id="musicPlayer" aria-hidden="false">
    <div class="music-player-content">
        <div class="music-player-header">
            <h3 id="songTitle">Загрузка...</h3>
            <button class="music-player-minimize" id="minimizeBtn" aria-label="Minimize player">
                <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
        </div>
        <div class="music-player-body">
            <div class="music-progress" aria-label="Progress bar">
                <div class="music-progress-bar" id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div class="music-time">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>
        <div class="music-player-controls">
            <button class="music-control-btn" id="prevBtn" title="Назад" aria-label="Previous track">
                <i class="fas fa-step-backward" aria-hidden="true"></i>
            </button>
            <button class="music-control-btn play-btn" id="playBtn" title="Играть/Пауза" aria-label="Play or pause">
                <i class="fas fa-play" aria-hidden="true"></i>
            </button>
            <button class="music-control-btn" id="nextBtn" title="Далее" aria-label="Next track">
                <i class="fas fa-step-forward" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>

<!-- PLAYER TOGGLE BUTTON -->
<button class="music-player-toggle" id="playerToggleBtn" title="Открыть плеер" aria-label="Open player">
    <i class="fas fa-music" aria-hidden="true"></i>
</button>

<!-- AUDIO ELEMENT -->
<audio id="audioElement"></audio>

<footer class="footer">
    <div class="footer-container">
        <div class="social-links-footer">
            <a href="javascript:void(0)" data-href="https://t.me/Toolgool" class="social-link-footer" title="Telegram" target="_blank">
                <i class="fab fa-telegram" aria-hidden="true"></i>
            </a>
            <a href="javascript:void(0)" data-href="https://www.tiktok.com/@Toolgool2023" class="social-link-footer" title="TikTok" target="_blank">
                <i class="fab fa-tiktok" aria-hidden="true"></i>
            </a>
        </div>

        <div class="legal-links">
            <a href="javascript:void(0)" data-href="https://telegra.ph/%E4%BA%97-ZAKON-O-KONFIDENCIALNOSTI-I-ZASHCHITE-LICHNOSTI-%E4%BA%97-08-09-2" class="legal-link" target="_blank">
                ‼️ IMPORTANT ‼️
            </a>
        </div>

        <div class="footer-text">
            <p>&copy; 2024-2026 Toolgool. All rights reserved.</p>
        </div>
    </div>
</footer>

<!-- PROFILE MODAL -->
<div class="modal" id="profileModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
        <button class="modal-close" aria-label="Close modal">&times;</button>
        <div id="modalBody"></div>
    </div>
</div>

<script src="intro.js"></script>
<script src="script.js"></script>
</body>
</html>
